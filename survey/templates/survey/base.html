<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DASS-21 — {% block title %}{% endblock %}</title>
  <style>
    body {
      background: #addfe7;
      font-family: 'Lora', Georgia, serif;
      margin: 0;
      padding: 0;
      color: #1f3a3f;
    }
    nav.topbar {
      background-color: #fbcc20;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    nav.topbar .brand {
      color: white;
      font-size: 28px;
      font-weight: bold;
      text-decoration: none;
    }
    nav.topbar .home-link {
      color: white;
      font-size: 16px;
      text-decoration: none;
      opacity: 0.9;
    }
    nav.topbar .home-link:hover { opacity: 1; }
    .container {
      max-width: 900px;
      margin: 24px auto;
      padding: 0 16px 48px;
    }
    h1, h2, h3 { font-weight: normal; }
    h1 { font-size: 28px; margin-top: 0; }
    .card {
      background: white;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    a.btn, button.btn {
      display: inline-block;
      background-color: #fbcc20;
      border: 1px solid #d6a906;
      color: #1f3a3f;
      padding: 10px 20px;
      font-size: 16px;
      font-family: inherit;
      border-radius: 4px;
      text-decoration: none;
      cursor: pointer;
    }
    a.btn:hover, button.btn:hover { background-color: #f5c000; }
    a.btn.secondary { background: white; }
    table.q-table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      font-size: 17px;
    }
    table.q-table th, table.q-table td {
      border: 1px solid #91bbc2;
      padding: 10px;
      vertical-align: middle;
    }
    table.q-table thead th {
      background: #c5e9ee;
      text-align: center;
    }
    table.q-table th.q-num, table.q-table td.q-opt {
      text-align: center;
      width: 50px;
    }
    table.q-table tr.error td { background: #ffe6e6; }
    .legend { margin: 16px 0 24px; line-height: 1.7; }
    .people-list { list-style: none; padding: 0; }
    .people-list li { margin: 8px 0; }
    .people-list a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      background: white;
      border: 1px solid #91bbc2;
      border-radius: 6px;
      text-decoration: none;
      color: #1f3a3f;
      font-size: 18px;
    }
    .people-list a:hover { background: #eaf6f8; }
    .people-list .caught-up {
      color: #2e8b2e;
      font-size: 22px;
      font-weight: bold;
      line-height: 1;
    }
    .people-list .behind {
      color: #c0392b;
      font-size: 22px;
      line-height: 1;
    }
    .date-list { list-style: none; padding: 0; }
    .date-list li {
      margin: 6px 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .date-list a, .date-list .disabled {
      flex: 1;
      padding: 10px 14px;
      background: white;
      border: 1px solid #91bbc2;
      border-radius: 6px;
      text-decoration: none;
      color: #1f3a3f;
    }
    .date-list a:hover { background: #eaf6f8; }
    .date-list .disabled {
      color: #888;
      background: #f3f3f3;
      cursor: not-allowed;
    }
    .date-list .badge {
      font-size: 13px;
      padding: 3px 8px;
      border-radius: 10px;
      background: #ddd;
      color: #444;
    }
    .date-list .badge.today { background: #fbcc20; color: #1f3a3f; }
    .date-list .badge.done { background: #5cb85c; color: white; }
    .errors { color: #b00020; margin-bottom: 16px; }
    .actions { margin-top: 24px; display: flex; gap: 12px; }
  </style>
</head>
<body>
  <nav class="topbar">
    <a class="brand" href="{% url 'home' %}">DASS-21</a>
    <a class="home-link" href="{% url 'home' %}">Početna</a>
  </nav>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
