{% extends "survey/base.html" %}
{% block title %}Admin prijava{% endblock %}
{% block content %}
  <div class="card">
    <h1>Admin prijava</h1>
    {% if error %}<p class="errors">{{ error }}</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      <p>
        <label for="password">Lozinka:</label><br>
        <input type="password" id="password" name="password" autofocus>
      </p>
      <div class="actions">
        <button class="btn" type="submit">Prijava</button>
      </div>
    </form>
  </div>
{% endblock %}
